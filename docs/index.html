<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇳🇴 オスロ周辺イベント情報</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #003087 0%, #0066cc 100%);
    padding: 32px 24px;
    text-align: center;
  }
  header h1 { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
  header p { font-size: 13px; opacity: 0.85; }
  .updated {
    text-align: center;
    font-size: 12px;
    color: #8b949e;
    padding: 12px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
  }
  .filter-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 12px 24px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    justify-content: center;
  }
  .filter-label {
    font-size: 11px;
    color: #8b949e;
    display: flex;
    align-items: center;
    padding: 0 4px;
  }
  .filter-divider {
    width: 1px;
    background: #30363d;
    margin: 0 8px;
  }
  .filter-btn {
    background: #21262d;
    border: 1px solid #30363d;
    color: #e6edf3;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .filter-btn:hover { background: #30363d; }
  .filter-btn.active-time { background: #1a4a1a; border-color: #2ea043; color: #3fb950; }
  .filter-btn.active-city { background: #0066cc; border-color: #0066cc; }
  .week-section {
    max-width: 800px;
    margin: 24px auto;
    padding: 0 16px;
  }
  .week-label {
    font-size: 13px;
    font-weight: bold;
    color: #8b949e;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #21262d;
  }
  .week-label.this-weekend { color: #3fb950; border-color: #2ea043; }
  .event-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }
  .event-card:hover { border-color: #0066cc; }
  .event-card.highlight { border-left: 3px solid #f0b429; }
  .event-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .event-date { font-size: 12px; color: #58a6ff; font-weight: bold; }
  .event-city {
    font-size: 11px;
    background: #21262d;
    padding: 2px 8px;
    border-radius: 10px;
    color: #8b949e;
  }
  .event-title { font-size: 16px; font-weight: bold; margin-bottom: 6px; }
  .event-desc {
    font-size: 13px;
    color: #8b949e;
    margin-bottom: 8px;
    line-height: 1.6;
    padding: 6px 10px;
    background: #0d1117;
    border-radius: 6px;
    border-left: 2px solid #30363d;
  }
  .event-desc.loading-desc { color: #484f58; font-style: italic; }
  .event-link { font-size: 12px; color: #58a6ff; text-decoration: none; }
  .event-link:hover { text-decoration: underline; }
  .loading { text-align: center; padding: 60px; color: #8b949e; font-size: 16px; }
  .no-events { text-align: center; padding: 40px; color: #8b949e; }
  footer {
    text-align: center;
    padding: 24px;
    font-size: 11px;
    color: #484f58;
    border-top: 1px solid #21262d;
    margin-top: 40px;
  }
</style>
</head>
<body>

<header>
  <h1>🇳🇴 オスロ周辺 イベント情報</h1>
  <p>Oslo・Gothenburg・Kristiansand エリア ／ 今後1ヶ月</p>
</header>

<div class="updated" id="updated-at">データ読み込み中...</div>

<div class="filter-bar">
  <span class="filter-label">期間：</span>
  <button class="filter-btn active-time" id="btn-time-all" onclick="filterTime('all', this)">すべて</button>
  <button class="filter-btn" id="btn-time-weekend" onclick="filterTime('weekend', this)">🗓 今週末</button>
  <button class="filter-btn" id="btn-time-future" onclick="filterTime('future', this)">📆 来週以降</button>
  <div class="filter-divider"></div>
  <span class="filter-label">エリア：</span>
  <button class="filter-btn active-city" id="btn-city-all" onclick="filterCity('all', this)">すべて</button>
  <button class="filter-btn" id="btn-city-oslo" onclick="filterCity('oslo', this)">🏙 Oslo</button>
  <button class="filter-btn" id="btn-city-got" onclick="filterCity('goteborg', this)">🇸🇪 Göteborg</button>
  <button class="filter-btn" id="btn-city-krs" onclick="filterCity('kristiansand', this)">🌊 Kristiansand</button>
</div>

<div id="events-container">
  <div class="loading">⏳ イベント情報を読み込み中...</div>
</div>

<footer>
  情報ソース: Ticketmaster / VisitOslo / VisitNorway<br>
  毎週金曜17時（オスロ時間）更新 ／ イベント情報は変更になる場合があります
</footer>

<script>
let allEvents = [];
let currentTime = 'all';
let currentCity = 'all';

// 今週末の土日を計算
function getThisWeekend() {
  const now = new Date();
  const day = now.getDay(); // 0=日, 6=土
  const saturday = new Date(now);
  saturday.setDate(now.getDate() + ((6 - day + 7) % 7 || 7));
  saturday.setHours(0,0,0,0);
  const sunday = new Date(saturday);
  sunday.setDate(saturday.getDate() + 1);
  sunday.setHours(23,59,59,999);
  return { saturday, sunday };
}

async function loadEvents() {
  try {
    const res = await fetch('events.json?t=' + Date.now());
    const data = await res.json();
    allEvents = data.events || [];
    const updated = data.updated_at
      ? new Date(data.updated_at).toLocaleString('ja-JP')
      : '不明';
    document.getElementById('updated-at').textContent =
      `最終更新: ${updated} ／ ${allEvents.length}件のイベント`;
    applyFilters();
  } catch (e) {
    document.getElementById('events-container').innerHTML =
      '<div class="no-events">⚠️ データの読み込みに失敗しました。<br>しばらく経ってから再度アクセスしてください。</div>';
    document.getElementById('updated-at').textContent = 'データ未取得';
  }
}

function filterTime(mode, btn) {
  currentTime = mode;
  document.querySelectorAll('.filter-btn').forEach(b => {
    if (['btn-time-all','btn-time-weekend','btn-time-future'].includes(b.id))
      b.classList.remove('active-time');
  });
  btn.classList.add('active-time');
  applyFilters();
}

function filterCity(city, btn) {
  currentCity = city;
  document.querySelectorAll('.filter-btn').forEach(b => {
    if (['btn-city-all','btn-city-oslo','btn-city-got','btn-city-krs'].includes(b.id))
      b.classList.remove('active-city');
  });
  btn.classList.add('active-city');
  applyFilters();
}

function applyFilters() {
  let filtered = [...allEvents];
  const { saturday, sunday } = getThisWeekend();
  const now = new Date();
  now.setHours(0,0,0,0);

  // 期間フィルター
  if (currentTime === 'weekend') {
    filtered = filtered.filter(ev => {
      if (!ev.date) return false;
      const d = new Date(ev.date);
      return d >= saturday && d <= sunday;
    });
  } else if (currentTime === 'future') {
    filtered = filtered.filter(ev => {
      if (!ev.date) return false;
      const d = new Date(ev.date);
      const nextMonday = new Date(saturday);
      nextMonday.setDate(saturday.getDate() + 2);
      return d >= nextMonday;
    });
  }

  // エリアフィルター
  if (currentCity !== 'all') {
    filtered = filtered.filter(ev =>
      (ev.city || '').toLowerCase().includes(currentCity)
    );
  }

  renderEvents(filtered);
}

function groupByWeek(events) {
  const weeks = {};
  const { saturday } = getThisWeekend();

  events.forEach(ev => {
    const date = ev.date ? new Date(ev.date) : null;
    if (!date || isNaN(date)) {
      if (!weeks['9999']) weeks['9999'] = { label: '日付未定', isWeekend: false, events: [] };
      weeks['9999'].events.push(ev);
      return;
    }
    const monday = new Date(date);
    monday.setDate(date.getDate() - ((date.getDay() + 6) % 7));
    const key = monday.toISOString().slice(0, 10);
    if (!weeks[key]) {
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      const isWeekend = date >= saturday && date <= new Date(saturday.getTime() + 86400000);
      weeks[key] = {
        label: `${monday.getMonth()+1}/${monday.getDate()} 〜 ${sunday.getMonth()+1}/${sunday.getDate()} の週`,
        isWeekend,
        events: []
      };
    }
    weeks[key].events.push(ev);
  });
  return weeks;
}

function formatDate(dateStr) {
  if (!dateStr) return '日付未定';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  const days = ['日','月','火','水','木','金','土'];
  return `${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;
}

// Claude APIで日本語説明を生成
async function generateDescription(title, category, city) {
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 100,
        messages: [{
          role: 'user',
          content: `以下のイベントについて、日本語で30文字以内の一言説明を書いてください。説明文のみ返してください。\nイベント名: ${title}\nカテゴリ: ${category}\n都市: ${city}`
        }]
      })
    });
    const data = await res.json();
    return data.content?.[0]?.text || '';
  } catch {
    return '';
  }
}

function renderEvents(events) {
  const container = document.getElementById('events-container');
  if (events.length === 0) {
    container.innerHTML = '<div class="no-events">該当するイベントが見つかりませんでした。</div>';
    return;
  }

  const weeks = groupByWeek(events);
  const sortedKeys = Object.keys(weeks).sort();
  let html = '';

  sortedKeys.forEach(key => {
    const { label, isWeekend, events: wevents } = weeks[key];
    const labelClass = isWeekend && currentTime !== 'future' ? 'week-label this-weekend' : 'week-label';
    const weekendBadge = isWeekend && currentTime !== 'future' ? ' 🟢 今週末' : '';
    html += `<div class="week-section">`;
    html += `<div class="${labelClass}">📅 ${label}${weekendBadge}</div>`;

    wevents.forEach((ev, i) => {
      const isHighlight = ev.category && /music|concert|festival/i.test(ev.category);
      const cardClass = isHighlight ? 'event-card highlight' : 'event-card';
      const cityLabel = ev.city || ev.venue || '';
      const url = ev.url || '';
      const descId = `desc-${key}-${i}`;

      html += `<div class="${cardClass}">
        <div class="event-meta">
          <span class="event-date">${formatDate(ev.date)}</span>
          ${cityLabel ? `<span class="event-city">📍 ${cityLabel}</span>` : ''}
          ${ev.category ? `<span class="event-city">${ev.category}</span>` : ''}
        </div>
        <div class="event-title">${ev.title || ''}</div>
        <div class="event-desc loading-desc" id="${descId}">説明を生成中...</div>
        ${url ? `<a class="event-link" href="${url}" target="_blank" rel="noopener">🎟 チケット・詳細</a>` : ''}
      </div>`;
    });

    html += `</div>`;
  });

  container.innerHTML = html;

  // 説明文を非同期で生成（表示後に順次埋める）
  let descIndex = 0;
  sortedKeys.forEach(key => {
    const { events: wevents } = weeks[key];
    wevents.forEach((ev, i) => {
      const descId = `desc-${key}-${i}`;
      const delay = descIndex * 300; // API負荷を分散
      descIndex++;
      setTimeout(async () => {
        const el = document.getElementById(descId);
        if (!el) return;
        if (ev.description) {
          el.textContent = ev.description;
          el.classList.remove('loading-desc');
        } else {
          const desc = await generateDescription(ev.title, ev.category, ev.city);
          if (el) {
            el.textContent = desc || ev.title;
            el.classList.remove('loading-desc');
          }
        }
      }, delay);
    });
  });
}

loadEvents();
</script>
</body>
</html>
