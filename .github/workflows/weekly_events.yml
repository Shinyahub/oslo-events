name: 週次オスロイベントメール配信

on:
  schedule:
    # 毎週金曜15時UTC = オスロ夏時間17時
    - cron: "0 15 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no email sent)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  send-weekly-events:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # docs/events.json をpushするために必要

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 依存ライブラリのインストール
        run: pip install -r requirements.txt

      - name: イベント収集・JSON書き出し・メール送信
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          WEEKS_AHEAD: "4"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python -m src.main

      - name: events.jsonをGitHubにpush（GitHub Pages更新）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/events.json
          git diff --staged --quiet || git commit -m "chore: update events.json [skip ci]"
          git push
